# udp-ingest — octo-pod arm #1. Thin binary: the UDP wire protocol only;
# session/keying/gating/stats come from octo-arm-common. See
# Copy this crate's shape for a new wire protocol.

[package]
name = "udp-ingest"
version = "0.1.0"
# Never goes to crates.io: these are binaries baked into container images. Saying so is
# also what lets cargo-deny accept the workspace path dependency — crates.io forbids
# path deps, so a crate that CLAIMS to be publishable while using one is a real defect.
publish = false
description = "octo-pod UDP ingest arm: labeled UDP listeners to native mTLS Zenoh publish, capture-first with ip-only provenance"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "udp-ingest"
path = "src/main.rs"

[dependencies]
octo-arm-common = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
