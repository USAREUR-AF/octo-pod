# octo-arm-common — everything octo-pod arms share.
#
# An arm binary should contain ONLY its wire protocol. Session setup,
# provenance keying, source gating, and stats live here so every arm
# behaves identically where identical behavior is the contract.

[package]
name = "octo-arm-common"
version = "0.1.0"
description = "Shared library for octo-pod arms: mTLS Zenoh session, provenance keying, source allowlist, stats"
# Never goes to crates.io: these are binaries baked into container images, and the
# lib exists to be shared by them. Saying so is also what lets cargo-deny accept the
# workspace path dependency — crates.io forbids path deps, so a crate that CLAIMS to
# be publishable while using one is a real defect, not a false positive.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The in-process test router (src/testing.rs). Arms enable it from [dev-dependencies]
# only, so no arm binary carries it.
test-support = []

[dependencies]
zenoh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
serde_json = "1"

[lints]
workspace = true
