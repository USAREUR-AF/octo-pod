# tcp-connect — octo-pod arm #4. Thin binary: dial-out TCP wire protocol
# only; session/keying/gating/stats come from octo-arm-common.
#
# The inverse of tcp-ingest. tcp-ingest LISTENS for sources that connect
# to it; a large class of sensors is itself the server — a radar-one sensor
# and the simulator that replays it both accept a client
# and then write. Two servers never connect, so those feeds had no arm
# until this one. See ../../docs/adding-an-arm.md.

[package]
name = "tcp-connect"
version = "0.1.0"
# Never goes to crates.io: these are binaries baked into container images. Saying so is
# also what lets cargo-deny accept the workspace path dependency — crates.io forbids
# path deps, so a crate that CLAIMS to be publishable while using one is a real defect.
publish = false
description = "octo-pod TCP dial-out arm: connects to sensors that serve their own stream (radar-one class), with reconnect, to native mTLS Zenoh publish"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tcp-connect"
path = "src/main.rs"

[dependencies]
octo-arm-common = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
