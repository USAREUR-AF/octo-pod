# Copy this directory OUT of this repo and fill it in. Nothing here is shared with
# any other pod — this is identity, and identity is per-box.
#
# THE HOSTNAME BELOW IS LOAD-BEARING. It must be identical to:
#   · the host_vars/<name>/ directory name  — Ansible binds identity by directory,
#     and a mismatch yields no identity, no publishers, and NO ERROR
#   · the name passed to `goat machine enroll`
#   · this pod's NetBird peer name
# Lowercase [a-z0-9-] only; bootstrap-octo-pod.yml asserts it.
#
# A pod converges ITSELF: ansible_connection=local, no control node, no SSH inbound.
# Use ansible_host= instead if you drive it from a workstation over the mesh.
[octopod]
pod-example-01 ansible_connection=local

[octopod:vars]
ansible_python_interpreter=/usr/bin/python3
