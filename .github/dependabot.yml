# Weekly dependency updates. Commit titles follow the PR-title gate.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /arms
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # Zenoh stays on 1.9.x. Every arm speaks the router's 1.9.0 protocol, and a newer
    # client is a coordinated upgrade of the router and every pod, not a dependency bump.
    # Patch releases within 1.9 still come through.
    ignore:
      - dependency-name: "zenoh"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "zenoh-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]

  # Base images are pinned by digest in each arm's Dockerfile. One group moves every arm
  # to the same base digests in one PR, so the arms never run on different bases.
  - package-ecosystem: docker
    directories: ["/arms/*"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # The ClusterFuzzLite build image is pinned by digest in .clusterfuzzlite/Dockerfile. It
  # is not an arm base image, so it stays out of the arms' entry.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
