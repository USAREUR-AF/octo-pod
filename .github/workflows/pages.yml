#
# The landing page: checks site/ and publishes it to GitHub Pages.
#
# site/build.py fails when a number the page states differs from the tree or the
# recorded capture. A pull request that touches the page runs the check; a push to
# main also deploys, once the repository's Pages source is set to "GitHub Actions".
# Until then the deploy job is skipped, not failed.
name: pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'arms/Cargo.toml'
      - 'arms/udp-ingest/src/main.rs'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'arms/Cargo.toml'
      - 'arms/udp-ingest/src/main.rs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the page against the tree and the capture
        run: python3 site/build.py
      - name: Keep only what the page serves
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R site/index.html site/assets "$RUNNER_TEMP/site/"
          rm -f "$RUNNER_TEMP/site/assets/"*.license
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      # Pages is set up by a repository owner. Until it is, there is nothing to
      # deploy to, so the deploy job does not run.
      - name: Is Pages set up to deploy from GitHub Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" -q .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not set to deploy from GitHub Actions; the page was checked, not deployed."
          fi

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
