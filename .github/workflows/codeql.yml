name: codeql
on:
  # Every pull request and every push to main, so every commit that lands is analyzed.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'   # weekly, to pick up new queries against unchanged code
permissions:
  contents: read
jobs:
  # Runs on the public repository. A private repository uses GitHub's CodeQL default
  # setup instead: GitHub rejects uploads from this workflow while default setup is
  # enabled, so running both would analyze every commit twice and keep only one result.
  codeql:
    if: ${{ !github.event.repository.private }}
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
      actions: read            # the CodeQL action reads its own workflow run
    strategy:
      fail-fast: false
      matrix:
        # rust: the arms; python: the CLI and tools; actions: these workflows.
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
