#
# The leak gate: a check on every pull request to the default branch.
#
# Fails when a pull request adds a name of the maintainers' own deployments
# (a host, zone, address, group or person) or material that is never right
# here (a private key, an access key id, a token). The list of names is not in
# this repository: it is the encrypted organization secret GOAT_LEAK_NEEDLES.
# A hit names the file, the line and a 12-character id of the needle; the
# needle itself and the matched line are never printed.
#
# The scanner lives in goatcore (.github/leak-gate/scan-diff.py) and is taken
# from its main branch; this repository carries only this file.
#
# pull_request_target runs this file as it is on the default branch, with the
# secret, also for pull requests from forks. The pull request's commits are
# fetched as data and diffed; they are never checked out, built or run.
name: leak-gate

on:
  pull_request_target:
    # `labeled` lets an owner make the gate run on a pull request without a
    # push: add any label.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]

permissions:
  contents: read

concurrency:
  group: leak-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  leak-gate:
    name: leak-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No `ref`: under pull_request_target that is the base branch, never the
      # pull request.
      - name: check out the base branch
        # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: the scanner, from goatcore main
        # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: USAREUR-AF/goatcore
          ref: main
          path: .goatcore-leak-gate
          sparse-checkout: .github/leak-gate
          persist-credentials: false

      - name: fetch the pull request's commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "${BASE_SHA}"
          fi
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/leak-gate/head"
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "${HEAD_SHA}"
          fi

      - name: scan the added lines, the messages and the text
        env:
          GOAT_LEAK_NEEDLES: ${{ secrets.GOAT_LEAK_NEEDLES }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 .goatcore-leak-gate/.github/leak-gate/scan-diff.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --messages \
            --text-env "PR_TITLE=title" --text-env "PR_BODY=body" --text-env "PR_BRANCH=branch name"
