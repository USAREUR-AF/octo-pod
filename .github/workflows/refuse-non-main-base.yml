name: refuse-non-main-base

# Every pull request targets main. A pull request stacked on another branch lands in a
# deleted base when that branch is squash-merged first, and its content never reaches
# main. Wait for the other pull request to merge, then rebase onto main.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  base-is-main:
    name: PR base must be main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${PR_BASE}" != "main" ]; then
            cat <<MSG
          ::error::This pull request targets '${PR_BASE}', not main.

          Retarget it to main:
            gh pr edit ${PR_NUMBER} --base main
            git rebase origin/main
            git push --force-with-lease
          MSG
            exit 1
          fi
          echo "OK: the base is main."
