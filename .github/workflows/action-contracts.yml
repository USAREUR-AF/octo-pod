# Exercise action upgrades without registry writes, signing or releases.
name: Action contracts
on:
  pull_request:
    paths: ['.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: action-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        leg: [one, two]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: create a registry-free build context
        env:
          LEG: ${{ matrix.leg }}
        run: |
          mkdir -p /tmp/action-context
          printf 'FROM scratch\nLABEL smoke.leg="%s"\n' "$LEG" > /tmp/action-context/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: image
        with:
          context: /tmp/action-context
          tags: local/action-contract:smoke
          load: true
          push: false
          provenance: false
      - name: verify the image and export an empty digest marker
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          DIGEST: ${{ steps.image.outputs.digest }}
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect local/action-contract:smoke --format '{{.Id}}')" = "$IMAGE_ID"
          test "$(docker image inspect local/action-contract:smoke --format '{{index .Config.Labels "smoke.leg"}}')" = "$LEG"
          mkdir -p /tmp/digests
          touch "/tmp/digests/fixture-${LEG}@${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-smoke-${{ matrix.leg }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  artifacts:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-smoke-*
          merge-multiple: true
      - name: verify both digest markers survived the archive handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path('/tmp/digests').iterdir())
          assert len(files) == 2, files
          assert {p.name.split('@')[0] for p in files} == {'fixture-one', 'fixture-two'}
          assert all(p.is_file() and p.stat().st_size == 0 for p in files)
          assert all(re.fullmatch(r'fixture-(one|two)@[0-9a-f]{64}', p.name) for p in files)
          PY
      - name: create a multi-file release fixture
        run: |
          mkdir -p /tmp/release-fixture
          printf 'synthetic package\n' > /tmp/release-fixture/package.txt
          (cd /tmp/release-fixture && sha256sum package.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-smoke
          path: /tmp/release-fixture/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-smoke
          path: /tmp/release-downloaded
      - name: verify the named multi-file artifact
        working-directory: /tmp/release-downloaded
        run: |
          sha256sum -c SHA256SUMS
          test "$(cat package.txt)" = 'synthetic package'
