# Full builds and final-image loader checks before merge. No registry credentials or pushes.
name: PR images
on:
  pull_request:
    paths: ['arms/**', 'tools/pr-image-matrix.py', 'tools/check-pr-image.sh', '.github/workflows/pr-images.yml']
permissions:
  contents: read
concurrency:
  group: pr-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: select changed images
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "images=$(python3 tools/pr-image-matrix.py "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.changes.outputs.images) }}
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build the complete image on its native runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: arms
          file: arms/${{ matrix.arm }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: local/octo-${{ matrix.arm }}:pr
          load: true
          push: false
          provenance: false
          # The same scope images.yml writes on main. A pull request reads its own cache,
          # then main's, so its first build already has main's compiled dependencies. What
          # it writes stays with the pull request: GitHub never lets a pull request's cache
          # into a build on main. One scope per architecture, shared by every arm, holds one
          # copy of the dependency layer that all seven Dockerfiles have in common.
          cache-from: type=gha,scope=arms-linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=arms-linux/${{ matrix.arch }},ignore-error=true
      - name: verify final-image architecture, nonroot user and every installed binary
        env:
          ARM: ${{ matrix.arm }}
          ARCH: ${{ matrix.arch }}
        run: bash tools/check-pr-image.sh "local/octo-${ARM}:pr" "$ARCH" "arms/${ARM}/Dockerfile"
