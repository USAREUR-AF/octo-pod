# Per-arm image publish to ghcr on pushes to main.
#
# MULTI-ARCH IS THE POINT. Pods are frequently arm64 (Jetson); operator laptops and
# cloud runners are amd64. An amd64-only image is the reason arms were compiled on the
# box, which made every pod's dependency tree a function of the day it was built and
# put crates.io in the deployment path of a border site.
#
# Native runners, not QEMU: emulated Rust builds take tens of minutes and time out.
# Each arch builds on its own runner and pushes by digest; a final job stitches the two
# digests into one manifest list, so a single tag serves both architectures.
#
# Registry path derives from the repo owner (never hardcode the org — a hardcoded org
# silently 403s when the repo moves; substrate finding).
#
# Deploys pin the pushed DIGEST, never a tag. After this workflow runs, copy the digest
# it prints into platform/group_vars/all/10-infrastructure.yml.
name: images

on:
  push:
    branches: [main]
    paths: ['arms/**', 'tools/check-image-sboms.py', '.github/workflows/images.yml']
  workflow_dispatch:

# Supersede an in-flight run for the same ref, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read   # read-only by default; jobs that need more ask for it

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # health-pub is not an arm — it publishes the pod's own health rather than a
        # sensor's data — but it is built, pushed and pinned by exactly the same rules,
        # so it rides the same matrix rather than growing a second pipeline that would
        # drift from this one.
        arm: [udp-ingest, tcp-ingest, tcp-connect, health-pub, egress, sapient, uplink-bridge]
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # REPRODUCIBLE IMAGES. BuildKit is what writes the image bytes, so it is pinned:
      # a different BuildKit may compress or order a layer differently. Dependabot does
      # not update this line; bump it by hand, here and in reproducible.yml together.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every timestamp in the image is the commit time: the image config, its history,
      # and (rewrite-timestamp below) every file in every layer. Two builds of one commit
      # then produce the same image manifest for each platform. The index that pods pin
      # still differs per build, because BuildKit's SBOM and provenance attestations
      # record when the build ran.
      - name: timestamps come from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: lowercase the owner
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octo-${{ matrix.arm }}" >> "$GITHUB_ENV"

      # Push by digest only — no tag. Tags are applied once, by the merge job, so a
      # half-finished matrix never leaves a tag pointing at one architecture.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: arms
          file: arms/${{ matrix.arm }}/Dockerfile
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # One scope per architecture, shared by every arm: the compiled-dependency layer is
          # the same in all seven Dockerfiles, so it is stored once and pr-images.yml reads
          # it from here. Arms on one architecture build at once and write the scope in
          # turn; a lost write costs a later rebuild, never a wrong image, so it does not
          # fail the build.
          cache-from: type=gha,scope=arms-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=arms-${{ matrix.platform }},ignore-error=true

      - name: export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arm }}@${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arm }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing of the provenance attestation
      attestations: write   # store it with GitHub's attestation API
    strategy:
      matrix:
        # MUST MATCH THE BUILD MATRIX. It did not: health-pub was added to build and not
        # here, so its per-architecture images were pushed and no manifest list was ever
        # created. `:latest` then resolves to whichever architecture pushed last, and an
        # arm64 pod pulling it gets "exec format error" — found on a Jetson, months later.
        # The coverage job below now fails when the two drift.
        arm: [udp-ingest, tcp-ingest, tcp-connect, health-pub, egress, sapient, uplink-bridge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: /tmp/digests, pattern: 'digest-*', merge-multiple: true }

      - name: create the manifest list
        id: manifest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octo-${{ matrix.arm }}"
          SHA="sha-${GITHUB_SHA::7}"
          # One file per (arm, arch), named <arm>@<digest>. Select this arm's.
          REFS=""
          for f in /tmp/digests/${{ matrix.arm }}@*; do
            [ -e "$f" ] || continue
            REFS="$REFS ${IMAGE}@sha256:$(basename "$f" | cut -d@ -f2)"
          done
          [ -n "$REFS" ] || { echo "::error::no digests for ${{ matrix.arm }}"; exit 1; }
          # Feature-branch builds provide immutable pins for review; latest moves only
          # after a main build has passed the architecture checks below.
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${IMAGE}:${SHA}" $REFS

          # The manifest-list digest is what deploys pin. Print it prominently: it is
          # the one value that has to reach group_vars, and it is not derivable later
          # without querying the registry.
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          # The group_vars key is not derivable from the arm name by string munging: a
          # two-way ternary silently mislabelled tcp-connect as tcp_ingest_image, so the
          # summary told you to paste a digest over the WRONG arm's pin. Explicit map,
          # and a new arm fails here rather than shipping a plausible wrong line.
          case "${{ matrix.arm }}" in
            udp-ingest)  var=udp_ingest_image ;;
            tcp-ingest)  var=tcp_ingest_image ;;
            tcp-connect) var=tcp_connect_image ;;
            health-pub)  var=health_pub_image ;;
            egress)      var=egress_image ;;
            sapient)     var=sapient_image ;;
            uplink-bridge) var=uplink_bridge_image ;;
            *) echo "::error::no group_vars pin name known for ${{ matrix.arm }}"; exit 1 ;;
          esac
          # TO STDOUT AS WELL AS THE SUMMARY. The manifest-list digest is the one value
          # that has to reach group_vars, and it cannot be derived afterwards without
          # querying the registry — which needs a credential the person doing the pinning
          # may not have. Writing it only to the step summary put it in a web page: not
          # greppable, not pipeable, and gone when the run expires.
          echo "PIN-THIS ${var}_upstream: \"${IMAGE}@${DIGEST}\"  # ${SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "### \`octo-${{ matrix.arm }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "${var}_upstream: \"${IMAGE}@${DIGEST}\"  # ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: prove it is a real manifest list
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octo-${{ matrix.arm }}"
          set -euo pipefail
          SHA="sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "${IMAGE}:${SHA}" --raw | jq -e '
            [.manifests[]? | .platform | select(.os == "linux") | .architecture]
            | unique | contains(["amd64", "arm64"])
          ' || { echo "::error::manifest must carry both linux/amd64 and linux/arm64"; exit 1; }

      - name: verify and export both platform SBOMs
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octo-${{ matrix.arm }}"
          SHA="sha-${GITHUB_SHA::7}"
          python3 tools/check-image-sboms.py "${IMAGE}:${SHA}" --output-dir /tmp/sboms

      # SIGN WHAT DEPLOYS PIN. The manifest-list digest gets a keyless provenance
      # attestation issued to this workflow and stored with the image, so a pin can be
      # checked before it merges: it must name a digest that this repository's images.yml
      # built from main. It is signed only after the architecture and SBOM checks above,
      # so a digest that failed them never carries a signature.
      - name: sign the manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ matrix.arm }}-${{ github.sha }}
          path: /tmp/sboms/*
          if-no-files-found: error
          retention-days: 90

      - name: promote a verified main build
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octo-${{ matrix.arm }}"
          SHA="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${SHA}"

  # EVERY IMAGE THAT WAS BUILT MUST HAVE A MANIFEST LIST. This exists because the build
  # matrix and the merge matrix are two lists that must agree and nothing made them.
  # health-pub was added to one and not the other: four architectures were pushed, no
  # manifest list was created, and `:latest` resolved to whichever architecture happened
  # to push last. Nothing failed. The symptom would have been an arm64 pod reporting
  # "exec format error" for an image that pulls perfectly on a laptop.
  #
  # Checked by OUTCOME rather than by comparing the two matrices — comparing config would
  # only prove the lists match, not that a manifest list exists. This asks the registry.
  # It also covers an image nobody has thought of yet, which a config comparison cannot.
  coverage:
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: /tmp/digests, pattern: 'digest-*', merge-multiple: true }

      - name: every built image is multi-arch
        run: |
          set -euo pipefail
          # One file per (image, arch), named <image>@<digest>. The distinct prefixes are
          # exactly the set of images this run built, whatever the matrices say.
          built=$(for f in /tmp/digests/*@*; do basename "$f" | cut -d@ -f1; done | sort -u)
          [ -n "$built" ] || { echo "::error::no digest artifacts — did the build matrix run?"; exit 1; }
          echo "built this run: $(echo "$built" | tr '\n' ' ')"
          bad=0
          for name in $built; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octo-${name}"
            sha="sha-${GITHUB_SHA::7}"
            if docker buildx imagetools inspect "${image}:${sha}" --raw | jq -e '
              [.manifests[]? | .platform | select(.os == "linux") | .architecture]
              | unique | contains(["amd64", "arm64"])
            '; then
              echo "  ok        ${image}:${sha} — amd64 and arm64"
            else
              echo "::error::${image}:${sha} is missing linux/amd64 or linux/arm64 — check its build and merge matrices."
              bad=1
            fi
          done
          [ "$bad" = 0 ]

