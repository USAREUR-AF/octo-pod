<title id="t">A sensor feed reaches the shared fabric only when you release it</title>
<desc id="d">One octo-pod at one site. Sensors on their own networks feed ingress arms (UDP, TCP, or a TCP sensor the pod dials) or connect as Zenoh peers to the pen, the pod's own Zenoh router. The pod captures and audits locally. The uplink bridge carries only released keys to the shared Zenoh fabric; the downlink gate brings approved fabric keys back to egress arms, which deliver to UDP or TCP receivers, systems that dial the sensor, SAPIENT controllers and partners' Zenoh routers. Every arm and peer has its own certificate and a narrow set of keys.</desc>
