# Triaged advisories for the Python locks in this directory, read by osv-scanner, by the
# OpenSSF Scorecard Vulnerabilities check, and by the pip-audit step in ci.yml, which
# passes each unexpired id to pip-audit with --ignore-vuln. These locks install CI and
# image-build tools; nothing here ships in a release or runs on a pod, except
# verify-zenoh.txt, which has no entry.
#
# Every entry expires: on that date the scanners report it again, and someone has to
# re-check the reason or remove the entry. platform/tests/test_release.py requires a
# reason and an expiry on each.

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2027-02-06
reason = "opentelemetry-api 1.37.0 in semgrep.txt: semgrep 1.184.0 requires ~=1.37.0, so 1.45.1 cannot be installed with it. The flaw is quadratic parsing of an inbound W3C tracestate header in TraceState.from_header. semgrep runs in CI as a command-line client with --metrics=off and parses no inbound HTTP. Remove when semgrep allows 1.45.1."

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2027-02-06
reason = "mcp 1.29.0 in semgrep.txt: semgrep 1.184.0 requires mcp==1.29.0 exactly. The flaw is session accumulation in the StreamableHTTP server transport, in the MCP SDK. CI runs only semgrep scan, which starts no MCP server or client. Remove when semgrep allows mcp 1.30.0."

