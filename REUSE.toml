# SPDX-FileCopyrightText: 2026 U.S. Federal Government (in countries where recognized)
# SPDX-License-Identifier: Apache-2.0
#
# Copyright and license for the files that carry no header of their own (REUSE
# Specification 3.3). Every other file states both in its first lines. `reuse lint`
# checks the whole tree on every pull request.

version = 1

# This project's files that cannot take a comment, or whose exact bytes are generated or
# compared: release metadata, generated lists and lock files, golden test output, and
# pinned requirement files.
[[annotations]]
path = [
  "VERSION",
  "NOTICE",
  "arms/NOTICE",
  "CHANGELOG.md",
  ".github/CODEOWNERS",
  ".github/PULL_REQUEST_TEMPLATE.md",
  "arms/Cargo.lock",
  "arms/about.hbs",
  "arms/sapient-receiver/NOTICE",
  "arms/sapient-receiver/tests/vectors/NOTICE",
  "arms/sapient-receiver/tests/vectors/manifest.json",
  "arms/fuzz/seeds/NOTICE",
  "arms/fuzz/seeds/downlink_gate/**",
  "platform/tests/golden/**",
  "platform/tests/requirements.txt",
  "tools/requirements/*.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 U.S. Federal Government (in countries where recognized)"
SPDX-License-Identifier = "Apache-2.0"

# Generated by cargo-about from arms/Cargo.lock and arms/about.hbs. It reproduces the
# license texts of the third-party crates in the arm images; each text keeps its own
# terms. The license tags quoted inside those texts are not this file's license, so this
# annotation overrides them.
[[annotations]]
path = "arms/THIRD_PARTY_LICENSES.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 U.S. Federal Government (in countries where recognized)"
SPDX-License-Identifier = "Apache-2.0"

# The SAPIENT protobuf definitions (BSI Flex 335 v2.0), vendored unmodified from
# https://github.com/dstl/SAPIENT-Proto-Files at tag BSI_Flex_335_v2.0_SAPIENT, with
# upstream's LICENCE.txt beside them.
[[annotations]]
path = "arms/sapient-proto/proto/**/*.proto"
precedence = "override"
SPDX-FileCopyrightText = "2023-2024 Crown Copyright (Dstl)"
SPDX-License-Identifier = "Apache-2.0"

# Unmodified reference vectors from https://github.com/dstl/BSI-Flex-335-v2-Test-Harness
# at commit 6a2999d70d761d224914ddd8fa3f663af5005be0, with upstream's LICENSE.txt.
[[annotations]]
path = [
  "arms/sapient-receiver/tests/vectors/true/**",
  "arms/sapient-receiver/tests/vectors/false/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2021-2024 Crown Copyright (Dstl)"
SPDX-License-Identifier = "Apache-2.0"

# Fuzz seeds: protobuf encodings of the reference vectors above, written by
# arms/fuzz/examples/make_seeds.rs (see arms/fuzz/seeds/NOTICE).
[[annotations]]
path = [
  "arms/fuzz/seeds/sapient_message/**",
  "arms/fuzz/seeds/sapient_frame/**",
  "arms/fuzz/seeds/tcp_frame/**",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2021-2024 Crown Copyright (Dstl)",
  "2026 U.S. Federal Government (in countries where recognized)",
]
SPDX-License-Identifier = "Apache-2.0"
